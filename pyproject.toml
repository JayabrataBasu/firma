[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "firma-lab"
version = "0.1.0"
description = "FIRMA offline orchestration, metrics and pre-registered analysis (manual §23.1): load, metrics, spec, runner, stats, sensitivity, plot, prereg."
requires-python = ">=3.10"
# pandas: load/metrics/stats tables. statsmodels (+ its scipy/patsy): MixedLM,
# PHReg (Cox) and Benjamini-Hochberg for firma_lab.stats. matplotlib:
# firma_lab.plot. See each module's docstring for why these and not others.
dependencies = ["pandas>=2.0", "statsmodels>=0.14", "scipy>=1.11", "matplotlib>=3.8"]

[tool.maturin]
# The Rust crate lives under crates/firma-py (workspace member, ADR 0046),
# not next to this file — manifest-path says where. The pure-Python package
# (`load`, `metrics`'s wrapper, and the Phase-3 stub modules) lives in
# python/firma_lab; python-source says where maturin finds it to include in
# the wheel alongside the compiled extension.
manifest-path = "crates/firma-py/Cargo.toml"
python-source = "python"
module-name = "firma_lab._native"
